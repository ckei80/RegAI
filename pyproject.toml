[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regai"
version = "0.1.0"
description = "Regulatory evidence and gap-assessment assistant"
requires-python = ">=3.14"
dependencies = [
    "openai",
    "pydantic",
    "requests",
    "beautifulsoup4",
]

[tool.setuptools.packages.find]
where = ["src"]